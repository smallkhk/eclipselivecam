<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1e3d"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="corona" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="#050810"/>

  <!-- Outer glow -->
  <circle cx="128" cy="128" r="110" fill="url(#glow1)"/>
  <circle cx="128" cy="128" r="90"  fill="url(#glow2)"/>

  <!-- Corona ring -->
  <circle cx="128" cy="128" r="95" fill="none" stroke="url(#corona)" stroke-width="8" stroke-dasharray="180 120" stroke-linecap="round" opacity="0.9"/>
  <circle cx="128" cy="128" r="95" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="60 240" stroke-dashoffset="120" stroke-linecap="round" opacity="0.7"/>

  <!-- Main eclipse circle -->
  <circle cx="128" cy="128" r="80" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="rgba(56,189,248,0.6)" stroke-width="2"/>

  <!-- Inner glow -->
  <circle cx="105" cy="105" r="35" fill="rgba(14,165,233,0.12)"/>

  <!-- Letter E stylized -->
  <text x="128" y="148" font-family="'Segoe UI',system-ui,sans-serif" font-weight="900"
    font-size="72" text-anchor="middle" fill="none"
    stroke="url(#corona)" stroke-width="2">E</text>
  <text x="128" y="148" font-family="'Segoe UI',system-ui,sans-serif" font-weight="900"
    font-size="72" text-anchor="middle"
    fill="rgba(232,240,255,0.92)">E</text>
</svg>
