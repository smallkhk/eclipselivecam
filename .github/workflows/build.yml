name: Build EclipseLiveCam (Windows)

on:
  push:
    branches: [main, desktop-virtual-cam]
  pull_request:
  workflow_dispatch:

# Needed to create GitHub Releases.
permissions:
  contents: write

env:
  # Pinned softcam release commit (MIT). Bump deliberately; the patch script
  # fails loudly if the lines it rebrands have moved.
  SOFTCAM_COMMIT: 8f545e2a3faa2c0d6e6e05378f945ee2a7adfc1d

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch softcam
        shell: bash
        run: |
          git init native/softcam
          git -C native/softcam remote add origin https://github.com/tshino/softcam.git
          git -C native/softcam fetch --depth 1 origin "$SOFTCAM_COMMIT"
          git -C native/softcam checkout FETCH_HEAD

      - name: Rebrand camera as EclipseLiveCam
        run: node native/patch-softcam.mjs native/softcam

      - uses: microsoft/setup-msbuild@v2

      - name: Build camera DLLs (x64 + Win32)
        working-directory: native/softcam
        run: |
          nuget restore softcam.sln
          msbuild /m /p:Configuration=Release /p:Platform=x64 softcam.sln
          msbuild /m /p:Configuration=Release /p:Platform=Win32 softcam.sln

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build frame helper
        shell: cmd
        run: |
          mkdir native\out\x64 native\out\x86
          cl /nologo /O2 /EHsc /MT /W4 native\eclipse-vcam.cpp /Fo:native\out\ /Fe:native\out\eclipse-vcam.exe
          del native\out\*.obj
          copy /y native\softcam\dist\bin\x64\softcam.dll native\out\x64\
          copy /y native\softcam\dist\bin\Win32\softcam.dll native\out\x86\
          copy /y native\softcam\LICENSE native\out\softcam-LICENSE.txt
          dir /s native\out

      - name: Install dependencies
        run: npm ci

      # Each build gets its own version (2.0.<run number>) so the app's
      # auto-updater can tell a newer release from the one installed.
      - name: Set build version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "${base}.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: EclipseLiveCam-Windows-Installer
          path: dist/*.exe
          retention-days: 30

      # Every build pushed to a branch becomes a GitHub Release with the
      # installer attached. Builds from main are the "Latest" release, which
      # installed apps auto-update to; builds from other branches are marked
      # as pre-releases (test builds) and are never offered as updates.
      - name: Release tag
        if: github.event_name != 'pull_request'
        id: tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "name=EclipseLiveCam ${version}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          fail_on_unmatched_files: true
          # latest.yml + .blockmap are what installed apps read to auto-update.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          body: |
            Windows installer for EclipseLiveCam with the built-in virtual camera.

            1. Download **EclipseLiveCam-Setup-*.exe** below and run it (accept the admin prompt — it installs the camera).
            2. Enter your activation key, log in and start a live stream.
            3. In Zoom, Meet, Teams, Discord or OBS pick **EclipseLiveCam** as your camera.

            Built from `${{ github.ref_name }}` at ${{ github.sha }}.
