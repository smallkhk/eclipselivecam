<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Viewer</title>
<style>
  :root { --bg:#0b0b0f; --panel:#15151c; --line:#262630; --text:#f2f2f7; --dim:#9a9aa6; --brand:#6c5ce7; --live:#2ec27e; --off:#6b6b76; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:16px; gap:12px; }
  .stage { position:relative; width:100%; max-width:420px; aspect-ratio:9/16;
    background:#000; border-radius:16px; overflow:hidden; border:1px solid var(--line);
    box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .stage img { width:100%; height:100%; object-fit:cover; display:block; }
  .offline { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; color:var(--dim); text-align:center; padding:24px; }
  .offline.hide { display:none; }
  .pill { position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,.55); padding:5px 10px; border-radius:999px; font-size:.78rem; font-weight:600;
    backdrop-filter:blur(6px); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--off); }
  .dot.on { background:var(--live); box-shadow:0 0 0 4px rgba(46,194,126,.25); }
  .sound { position:absolute; bottom:12px; right:12px; background:var(--brand); color:#fff; border:0;
    padding:9px 14px; border-radius:999px; font-weight:600; font-size:.82rem; cursor:pointer; }
  .sound.hide { display:none; }
  .title { font-weight:700; font-size:1.05rem; }
  .sub { color:var(--dim); font-size:.82rem; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title" id="title">Live</div>
  <div class="stage">
    <img id="frame" alt="">
    <div class="pill"><span class="dot" id="dot"></span><span id="state">Connecting…</span></div>
    <div class="offline" id="offline"><div style="font-size:2rem">📴</div><div>Offline right now</div></div>
    <button class="sound" id="sound">🔊 Tap for sound</button>
  </div>
  <div class="sub">Live viewer</div>
</div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>
  // ── Configure these two ────────────────────────────────────────────────────
  const BASE  = "https://eclipselivecam.online";   // where live.php lives
  const TOKEN = "PUT_YOUR_SHARE_TOKEN_HERE";        // the s=… value from your share link
  // ───────────────────────────────────────────────────────────────────────────

  const frame = document.getElementById('frame');
  const dot = document.getElementById('dot');
  const state = document.getElementById('state');
  const offline = document.getElementById('offline');
  const soundBtn = document.getElementById('sound');
  const audio = document.getElementById('audio');

  // Video: refresh a plain <img> (works cross-domain, no CORS).
  const viewURL = () => `${BASE}/api/live.php?action=view&s=${TOKEN}&t=${Date.now()}`;
  let liveNow = false;

  function setLive(on) {
    liveNow = on;
    dot.classList.toggle('on', on);
    state.textContent = on ? 'LIVE' : 'Offline';
    offline.classList.toggle('hide', on);
  }

  function tick() {
    const img = new Image();
    img.onload = () => { frame.src = img.src; setLive(true); };
    img.onerror = () => setLive(false);   // 204 when the stream is offline
    img.src = viewURL();
  }
  setInterval(tick, 100);   // ~10 fps
  tick();

  // Audio: an <audio> element plays a WAV of new audio (cross-domain, no CORS).
  // The server tracks how much this browser has heard via a cookie.
  let audioRunning = false;
  const audioURL = () => `${BASE}/api/live.php?action=audiowav&s=${TOKEN}&t=${Date.now()}`;

  function nextAudio() {
    if (!audioRunning) return;
    audio.src = audioURL();
    audio.play().catch(() => {});
  }
  // When a segment ends, fetch the next. Short segments (silence) = idle, wait longer.
  audio.addEventListener('ended', () => {
    const wait = (audio.duration && audio.duration < 0.5) ? 600 : 120;
    setTimeout(nextAudio, wait);
  });
  audio.addEventListener('error', () => { if (audioRunning) setTimeout(nextAudio, 900); });

  soundBtn.addEventListener('click', () => {
    audioRunning = true;
    soundBtn.classList.add('hide');
    nextAudio();   // first play is inside the tap, so autoplay rules are satisfied
  });
</script>
</body>
</html>
